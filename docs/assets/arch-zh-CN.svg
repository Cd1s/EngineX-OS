<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc">
  <title id="title">EngineX OS 运行架构</title>
  <desc id="desc">碟机上四个隔离的 CPU 核心（CPU0 实时音频、CPU1 界面、CPU2 I/O 中断、CPU3 后台任务）与 Stems 分轨路径：stems-processor 优先使用已配置的云端中继，其次是通过 mDNS 或 UDP 17891 在局域网自动发现的家用电脑，最后在碟机本机分轨。</desc>
  <style>
    .bg{fill:#ffffff}
    .frame{fill:none;stroke:#d0d7de}
    .deck{fill:#f6f8fa;stroke:#d0d7de}
    .card{fill:#ffffff;stroke:#d0d7de}
    .t{fill:#1f2328}
    .m{fill:#57606a}
    .faint{fill:#8c959f}
    .line{stroke:#8c959f}
    .chip{fill:#eaeef2}
    .g{fill:#00a152} .gs{stroke:#00a152}
    .b{fill:#0086c3} .bs{stroke:#0086c3}
    .a{fill:#b26a00} .as{stroke:#b26a00}
    .n{fill:#6e7781} .ns{stroke:#6e7781}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .frame{stroke:#30363d}
      .deck{fill:#11161d;stroke:#30363d}
      .card{fill:#161b22;stroke:#30363d}
      .t{fill:#e6edf3}
      .m{fill:#9da7b3}
      .faint{fill:#6e7681}
      .line{stroke:#6e7681}
      .chip{fill:#21262d}
      .g{fill:#00e676} .gs{stroke:#00e676}
      .b{fill:#00b0ff} .bs{stroke:#00b0ff}
      .a{fill:#ffb300} .as{stroke:#ffb300}
      .n{fill:#8b949e} .ns{stroke:#8b949e}
    }
    text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',monospace}
  </style>
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="g"/></marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="b"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="a"/></marker>
  </defs>

  <rect width="1200" height="660" rx="18" class="bg"/>
  <rect x="0.5" y="0.5" width="1199" height="659" rx="18" class="frame"/>
  <text x="36" y="46" font-size="22" font-weight="700" class="t">EngineX OS · 运行架构</text>
  <text x="36" y="70" font-size="13.5" class="m">碟机四核严格隔离，以及 Stems 分轨在哪里渲染</text>

  <!-- deck -->
  <rect x="24" y="92" width="676" height="544" rx="16" class="deck"/>
  <text x="44" y="122" font-size="12" font-weight="700" letter-spacing="1.5" class="faint">碟机 · ENGINE OS 5.3.0 · 4 × ARM 核心</text>

  <!-- CPU0 -->
  <g transform="translate(44 138)">
    <rect width="306" height="138" rx="12" class="card"/>
    <rect x="0" y="14" width="4" height="110" rx="2" class="g"/>
    <text x="22" y="32" font-size="12" font-weight="700" letter-spacing="1" class="mono g">CPU0</text>
    <text x="22" y="56" font-size="17" font-weight="700" class="t">实时音频</text>
    <text x="22" y="82" font-size="13" class="m mono">ALSA RAW · SCHED_FIFO 99</text>
    <text x="22" y="102" font-size="13" class="m">96 kHz · 450 帧周期</text>
    <text x="22" y="122" font-size="13" class="m">独占中断 · 1.2 GHz 频率下限 · 0 XRUN</text>
  </g>
  <!-- CPU1 -->
  <g transform="translate(374 138)">
    <rect width="306" height="138" rx="12" class="card"/>
    <rect x="0" y="14" width="4" height="110" rx="2" class="b"/>
    <text x="22" y="32" font-size="12" font-weight="700" letter-spacing="1" class="mono b">CPU1</text>
    <text x="22" y="56" font-size="17" font-weight="700" class="t">界面</text>
    <text x="22" y="82" font-size="13" class="m">Engine EMain · Qt Quick / QML</text>
    <text x="22" y="102" font-size="13" class="m">GPU / OpenGL 渲染</text>
    <text x="22" y="122" font-size="13" class="m">图片与文件线程降级</text>
  </g>
  <!-- CPU2 -->
  <g transform="translate(44 292)">
    <rect width="306" height="138" rx="12" class="card"/>
    <rect x="0" y="14" width="4" height="110" rx="2" class="n"/>
    <text x="22" y="32" font-size="12" font-weight="700" letter-spacing="1" class="mono n">CPU2</text>
    <text x="22" y="56" font-size="17" font-weight="700" class="t">I/O 中断</text>
    <text x="22" y="82" font-size="13" class="m">USB · SATA · 以太网中断</text>
    <text x="22" y="102" font-size="13" class="m mono">workqueue cpumask=6</text>
    <text x="22" y="122" font-size="13" class="m">远离音频核心</text>
  </g>
  <!-- CPU3 -->
  <g transform="translate(374 292)">
    <rect width="306" height="138" rx="12" class="card"/>
    <rect x="0" y="14" width="4" height="110" rx="2" class="a"/>
    <text x="22" y="32" font-size="12" font-weight="700" letter-spacing="1" class="mono a">CPU3</text>
    <text x="22" y="56" font-size="17" font-weight="700" class="t">后台任务</text>
    <text x="22" y="82" font-size="13" class="m mono">SCHED_IDLE · nice 19 · IO idle</text>
    <text x="22" y="102" font-size="13" class="m">流媒体 · 曲目分析 · RB 桥接</text>
    <text x="22" y="122" font-size="13" class="m">stems-processor · LocalRender</text>
  </g>

  <!-- stems-processor -->
  <g transform="translate(44 446)">
    <rect width="636" height="170" rx="12" class="card"/>
    <text x="22" y="32" font-size="17" font-weight="700" class="t">stems-processor <tspan font-size="13" font-weight="400" class="m">· Engine 的 Stems 子进程，依次尝试</tspan></text>
    <g font-size="13.5">
      <circle cx="34" cy="62" r="11" class="b"/><text x="34" y="67" text-anchor="middle" font-size="12" font-weight="700" class="bg">1</text>
      <text x="54" y="67" class="t">云端中继 <tspan class="m">— 已设置 relayUrl 时</tspan></text>
      <circle cx="34" cy="96" r="11" class="g"/><text x="34" y="101" text-anchor="middle" font-size="12" font-weight="700" class="bg">2</text>
      <text x="54" y="101" class="t">局域网家用电脑 <tspan class="m">— 350 毫秒内发现，地址已缓存</tspan></text>
      <circle cx="34" cy="130" r="11" class="a"/><text x="34" y="135" text-anchor="middle" font-size="12" font-weight="700" class="bg">3</text>
      <text x="54" y="135" class="t">CPU3 本机分轨 <tspan class="m">— 因果 IIR 分频，无需服务器</tspan></text>
    </g>
    <text x="22" y="160" font-size="11" class="faint">前一级完全连不上才换下一级；同一会话绝不拆分。</text>
  </g>

  <!-- home PC -->
  <g transform="translate(790 138)">
    <rect width="386" height="200" rx="14" class="card"/>
    <rect x="22" y="0" width="56" height="4" rx="2" class="g"/>
    <text x="22" y="38" font-size="12" font-weight="700" letter-spacing="1.5" class="faint">家用电脑 · 同一局域网</text>
    <text x="22" y="66" font-size="18" font-weight="700" class="t">sc5000-stemsd <tspan font-size="13" font-weight="400" class="m mono">:17890</tspan></text>
    <text x="22" y="94" font-size="13.5" class="m">worker.py · hpss 或 htdemucs</text>
    <text x="22" y="116" font-size="13.5" class="m">CUDA · Apple MPS · CPU</text>
    <rect x="22" y="134" width="214" height="24" rx="12" class="chip"/>
    <text x="34" y="151" font-size="12" class="mono g">_enginex-stems._tcp.local</text>
    <rect x="244" y="134" width="120" height="24" rx="12" class="chip"/>
    <text x="256" y="151" font-size="12" class="mono g">udp/17891</text>
    <text x="22" y="184" font-size="12" class="faint">run-home-worker.sh / .ps1 · 免密码，仅限局域网</text>
  </g>

  <!-- cloud -->
  <g transform="translate(790 392)">
    <rect width="386" height="200" rx="14" class="card"/>
    <rect x="22" y="0" width="56" height="4" rx="2" class="b"/>
    <text x="22" y="38" font-size="12" font-weight="700" letter-spacing="1.5" class="faint">云端 · 互联网</text>
    <text x="22" y="66" font-size="18" font-weight="700" class="t">sc5000-relay <tspan font-size="13" font-weight="400" class="m">→ sc5000-stemsd</tspan></text>
    <text x="22" y="94" font-size="13.5" class="m">HTTPS · 控制台密码</text>
    <text x="22" y="116" font-size="13.5" class="m">登录 · OAuth 回调 · Stems</text>
    <rect x="22" y="134" width="190" height="24" rx="12" class="chip"/>
    <text x="34" y="151" font-size="12" class="mono b">X-Stems-Framing: 2</text>
    <text x="22" y="184" font-size="12" class="faint">自建部署；4G / 5G 下也可用</text>
  </g>

  <!-- flows -->
  <g fill="none" stroke-width="2.2">
    <path d="M680 540 C 735 540, 735 492, 786 492" class="bs" marker-end="url(#arrowB)"/>
    <path d="M680 470 C 750 470, 730 300, 786 300" class="gs" marker-end="url(#arrowG)"/>
    <path d="M786 250 C 730 250, 728 210, 704 210" class="gs" stroke-dasharray="5 5" marker-end="url(#arrowG)"/>
  </g>
  <g font-size="11.5">
    <text x="712" y="200" class="g">发现广播</text>
  </g>

  <text x="1176" y="618" font-size="11.5" text-anchor="end" class="faint">上下行均为 int16</text>
  <text x="1176" y="636" font-size="11.5" text-anchor="end" class="faint">碟机还原 旋律 = 原音 − 人声 − 低音 − 鼓组</text>
</svg>
