<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="-apple-system,'Helvetica Neue','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <title>4-Deck View + Shadow Waveform — 四轨并排 + 影子波形</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d131b"/><stop offset="1" stop-color="#06090d"/></linearGradient>
    <radialGradient id="jog" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1c2a38"/><stop offset="0.7" stop-color="#0f1720"/><stop offset="1" stop-color="#05080b"/></radialGradient>
    <pattern id="wf" width="6" height="40" patternUnits="userSpaceOnUse"><rect width="6" height="40" fill="none"/><rect x="1" y="6" width="3" height="28" fill="#00e5ff" opacity=".55"/></pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <text x="40" y="52" fill="#e8f1f8" font-size="26" font-weight="700">四轨并排 + 跨机影子波形</text>
  <text x="40" y="80" fill="#7f93a5" font-size="15">SC5000 / SC6000 · 4-Deck View · Cross-deck zero-latency Shadow Waveform · 8-colour Hot Cue sync</text>

  <!-- Screen -->
  <rect x="40" y="104" width="820" height="520" rx="16" fill="#05080b" stroke="#2c3b4c" stroke-width="3"/>

  <!-- Four deck lanes: label, beat grid, waveform -->
  <g font-size="13" font-weight="700">
    <!-- Deck 1 main -->
    <rect x="60" y="124" width="780" height="104" rx="6" fill="#0c1319"/>
    <rect x="60" y="124" width="44" height="104" fill="#00e5ff"/><text x="82" y="182" text-anchor="middle" fill="#001418" font-size="20">1</text>
    <rect x="110" y="150" width="720" height="52" fill="url(#wf)"/>
    <!-- Deck 2 shadow -->
    <rect x="60" y="236" width="780" height="104" rx="6" fill="#0c1319"/>
    <rect x="60" y="236" width="44" height="104" fill="#39ff88"/><text x="82" y="294" text-anchor="middle" fill="#04150b" font-size="20">2</text>
    <rect x="110" y="262" width="720" height="52" fill="url(#wf)" style="filter:hue-rotate(-60deg)"/>
    <!-- Deck 3 -->
    <rect x="60" y="348" width="780" height="104" rx="6" fill="#0c1319"/>
    <rect x="60" y="348" width="44" height="104" fill="#ff9f1c"/><text x="82" y="406" text-anchor="middle" fill="#1b1000" font-size="20">3</text>
    <rect x="110" y="374" width="720" height="52" fill="url(#wf)" opacity=".6"/>
    <!-- Deck 4 -->
    <rect x="60" y="460" width="780" height="104" rx="6" fill="#0c1319"/>
    <rect x="60" y="460" width="44" height="104" fill="#ff4d8d"/><text x="82" y="518" text-anchor="middle" fill="#1b0008" font-size="20">4</text>
    <rect x="110" y="486" width="720" height="52" fill="url(#wf)" opacity=".6"/>
  </g>

  <!-- Beat grid lines crossing all lanes -->
  <g stroke="#ffffff" stroke-opacity=".35" stroke-width="1">
    <path d="M230 124V564M350 124V564M470 124V564M590 124V564M710 124V564M830 124V564"/>
  </g>
  <!-- Playhead -->
  <path d="M470 118V570" stroke="#ff3b30" stroke-width="3"/>
  <!-- Hot cue markers (8 colours) on deck 1 and deck 2 -->
  <g>
    <rect x="160" y="124" width="4" height="104" fill="#ff3b30"/><rect x="160" y="236" width="4" height="104" fill="#ff3b30"/>
    <rect x="260" y="124" width="4" height="104" fill="#ff9f1c"/><rect x="260" y="236" width="4" height="104" fill="#ff9f1c"/>
    <rect x="360" y="124" width="4" height="104" fill="#ffe14d"/><rect x="360" y="236" width="4" height="104" fill="#ffe14d"/>
    <rect x="560" y="124" width="4" height="104" fill="#39ff88"/><rect x="560" y="236" width="4" height="104" fill="#39ff88"/>
    <rect x="640" y="124" width="4" height="104" fill="#00e5ff"/><rect x="640" y="236" width="4" height="104" fill="#00e5ff"/>
    <rect x="720" y="124" width="4" height="104" fill="#3d6bff"/><rect x="720" y="236" width="4" height="104" fill="#3d6bff"/>
    <rect x="780" y="124" width="4" height="104" fill="#b04dff"/><rect x="780" y="236" width="4" height="104" fill="#b04dff"/>
    <rect x="810" y="124" width="4" height="104" fill="#ff4d8d"/><rect x="810" y="236" width="4" height="104" fill="#ff4d8d"/>
  </g>
  <text x="60" y="592" fill="#7f93a5" font-size="13">Deck 1–2 on this unit · Deck 3–4 shadow of the paired unit (影子轨来自另一台碟机)</text>

  <!-- Jog wheel with centre circular screen -->
  <circle cx="1040" cy="364" r="190" fill="url(#jog)" stroke="#2c3b4c" stroke-width="4"/>
  <circle cx="1040" cy="364" r="168" fill="none" stroke="#1f2b38" stroke-width="2" stroke-dasharray="3 9"/>
  <circle cx="1040" cy="364" r="112" fill="#05080b" stroke="#00e5ff" stroke-width="3"/>
  <rect x="990" y="314" width="100" height="100" rx="10" fill="#1e3a5f"/>
  <path d="M990 394 L1020 350 L1046 380 L1070 330 L1090 360 V414 H990Z" fill="#00e5ff" opacity=".6"/>
  <text x="1040" y="446" fill="#e8f1f8" font-size="13" text-anchor="middle" font-weight="700">Track Title · 98 BPM</text>
  <path d="M1040 182 L1040 212" stroke="#ff3b30" stroke-width="5"/>
  <text x="1040" y="596" fill="#9db0c0" font-size="13" text-anchor="middle">Jog wheel · 转盘</text>

  <!-- Callouts -->
  <g font-size="16" font-weight="700">
    <g transform="translate(900,150)"><circle r="18" fill="#00e5ff"/><text y="6" text-anchor="middle" fill="#001418" font-size="19">①</text></g>
    <path d="M880 150 H838" stroke="#00e5ff" stroke-width="2"/>
    <text x="928" y="146" fill="#00e5ff">主轨 Main deck</text>
    <text x="928" y="166" fill="#9db0c0" font-size="13" font-weight="400">Local track waveform</text>

    <g transform="translate(900,262)"><circle r="18" fill="#39ff88"/><text y="6" text-anchor="middle" fill="#04150b" font-size="19">②</text></g>
    <path d="M882 262 H838" stroke="#39ff88" stroke-width="2"/>
    <text x="928" y="258" fill="#39ff88">影子轨 Shadow deck</text>
    <text x="928" y="278" fill="#9db0c0" font-size="13" font-weight="400">Other unit's deck, zero-latency</text>

    <g transform="translate(600,664)"><circle r="18" fill="#ffffff"/><text y="6" text-anchor="middle" fill="#05080b" font-size="19">③</text></g>
    <path d="M600 646 V560" stroke="#ffffff" stroke-width="2"/>
    <text x="628" y="660" fill="#ffffff">拍格线对齐 Beat grids aligned</text>
    <text x="628" y="680" fill="#9db0c0" font-size="13" font-weight="400">All 4 lanes share one beat reference</text>

    <g transform="translate(260,664)"><circle r="18" fill="#ff9f1c"/><text y="6" text-anchor="middle" fill="#1b1000" font-size="19">④</text></g>
    <path d="M260 646 V230" stroke="#ff9f1c" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="288" y="660" fill="#ff9f1c">8 色 Hot Cue 标线</text>
    <text x="288" y="680" fill="#9db0c0" font-size="13" font-weight="400">8-colour Hot Cue markers synced</text>

    <g transform="translate(1180,200)"><circle r="18" fill="#b04dff"/><text y="6" text-anchor="middle" fill="#14001f" font-size="19">⑤</text></g>
    <path d="M1162 206 L1120 262" stroke="#b04dff" stroke-width="2"/>
    <text x="1230" y="244" fill="#b04dff" text-anchor="end">转盘中心圆屏</text>
    <text x="1230" y="264" fill="#9db0c0" font-size="13" font-weight="400" text-anchor="end">Jog-centre artwork screen</text>
  </g>

  <!-- Hot cue legend -->
  <g font-size="13" fill="#9db0c0">
    <text x="40" y="740">Hot Cue A–H:</text>
    <g>
      <rect x="150" y="726" width="22" height="18" fill="#ff3b30"/><rect x="180" y="726" width="22" height="18" fill="#ff9f1c"/>
      <rect x="210" y="726" width="22" height="18" fill="#ffe14d"/><rect x="240" y="726" width="22" height="18" fill="#39ff88"/>
      <rect x="270" y="726" width="22" height="18" fill="#00e5ff"/><rect x="300" y="726" width="22" height="18" fill="#3d6bff"/>
      <rect x="330" y="726" width="22" height="18" fill="#b04dff"/><rect x="360" y="726" width="22" height="18" fill="#ff4d8d"/>
    </g>
  </g>
</svg>
