<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="-apple-system,'Helvetica Neue','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <title>Rekordbox USB + Pro DJ Link bridge / Rekordbox U 盘与 Pro DJ Link 桥接</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d131b"/><stop offset="1" stop-color="#06090d"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00e5ff"/></marker>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <text x="40" y="52" fill="#e8f1f8" font-size="26" font-weight="700">Rekordbox 即插即用 · CDJ-3000 双向 Pro DJ Link</text>
  <text x="40" y="80" fill="#7f93a5" font-size="15">USB plug-and-play without re-analysis · Two-way Pro DJ Link · CDJ browses and plays EngineX streaming playlists</text>

  <!-- USB / Rekordbox -->
  <rect x="40" y="130" width="300" height="220" rx="14" fill="#111922" stroke="#243242" stroke-width="2"/>
  <text x="190" y="170" fill="#e8f1f8" font-size="20" font-weight="700" text-anchor="middle">Rekordbox USB</text>
  <rect x="120" y="190" width="140" height="70" rx="8" fill="#16202b" stroke="#ff9f1c" stroke-width="2"/>
  <text x="190" y="232" fill="#ff9f1c" font-size="16" text-anchor="middle">PIONEER/ export.pdb</text>
  <text x="190" y="290" fill="#9db0c0" font-size="14" text-anchor="middle">BPM · 拍格 · Cue · 波形 ANLZ</text>
  <text x="190" y="314" fill="#39ff88" font-size="14" text-anchor="middle">免重新分析 · No re-analysis</text>

  <!-- EngineX deck -->
  <rect x="490" y="130" width="300" height="220" rx="14" fill="#111922" stroke="#00e5ff" stroke-width="3"/>
  <text x="640" y="170" fill="#00e5ff" font-size="20" font-weight="700" text-anchor="middle">EngineX OS 碟机</text>
  <text x="640" y="196" fill="#9db0c0" font-size="14" text-anchor="middle">SC5000 / SC6000 / PRIME 4</text>
  <rect x="540" y="216" width="200" height="40" rx="8" fill="#16202b"/><text x="640" y="242" fill="#e8f1f8" font-size="15" text-anchor="middle">Local library · 本地曲库</text>
  <rect x="540" y="266" width="200" height="40" rx="8" fill="#16202b"/><text x="640" y="292" fill="#e8f1f8" font-size="15" text-anchor="middle">Streaming playlists · 流媒体歌单</text>

  <!-- CDJ-3000 -->
  <rect x="940" y="130" width="300" height="220" rx="14" fill="#111922" stroke="#39ff88" stroke-width="3"/>
  <text x="1090" y="170" fill="#39ff88" font-size="20" font-weight="700" text-anchor="middle">Pioneer CDJ-3000</text>
  <circle cx="1090" cy="250" r="50" fill="#0f1720" stroke="#2c3b4c" stroke-width="3"/><circle cx="1090" cy="250" r="28" fill="#05080b" stroke="#39ff88"/>
  <text x="1090" y="326" fill="#9db0c0" font-size="14" text-anchor="middle">LINK · Browse / 浏览 · Play / 播放</text>

  <!-- arrows -->
  <path d="M340 240 H484" stroke="#ff9f1c" stroke-width="4" marker-end="url(#a)"/>
  <path d="M790 220 H934" stroke="#00e5ff" stroke-width="4" marker-end="url(#a)"/>
  <path d="M934 270 H796" stroke="#39ff88" stroke-width="4" marker-end="url(#a)"/>

  <!-- Ethernet / switch -->
  <rect x="440" y="440" width="400" height="60" rx="10" fill="#16202b" stroke="#2c3b4c"/>
  <text x="640" y="477" fill="#e8f1f8" font-size="17" text-anchor="middle">Ethernet 交换机 / Switch · Pro DJ Link</text>
  <path d="M640 350 V440" stroke="#00e5ff" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1090 350 V470 H846" stroke="#39ff88" stroke-width="3" fill="none"/>

  <!-- CDJ screen mock: browse -->
  <rect x="940" y="540" width="300" height="190" rx="10" fill="#05080b" stroke="#39ff88" stroke-width="2"/>
  <text x="960" y="568" fill="#39ff88" font-size="14" font-weight="700">LINK › EngineX</text>
  <g font-size="14" fill="#e8f1f8">
    <rect x="956" y="580" width="268" height="30" rx="4" fill="#16202b"/><text x="968" y="600">☁ Streaming · 流媒体歌单</text>
    <rect x="956" y="618" width="268" height="30" rx="4" fill="#16202b"/><text x="968" y="638">♪ Local · 本地曲库</text>
    <rect x="956" y="656" width="268" height="30" rx="4" fill="#00e5ff" fill-opacity=".2"/><text x="968" y="676">▶ Around the World</text>
  </g>

  <!-- Callouts -->
  <g font-size="16" font-weight="700">
    <g transform="translate(190,420)"><circle r="20" fill="#ff9f1c"/><text y="6" text-anchor="middle" fill="#1b1000" font-size="20">①</text></g>
    <path d="M190 400 V354" stroke="#ff9f1c" stroke-width="2"/>
    <text x="222" y="416" fill="#ff9f1c">U 盘即插即用</text><text x="222" y="438" fill="#9db0c0" font-size="14" font-weight="400">Plug in, beat grids and cues kept</text>

    <g transform="translate(560,590)"><circle r="20" fill="#00e5ff"/><text y="6" text-anchor="middle" fill="#001418" font-size="20">②</text></g>
    <path d="M580 575 L640 504" stroke="#00e5ff" stroke-width="2"/>
    <text x="596" y="640" fill="#00e5ff" text-anchor="middle">双向 Pro DJ Link</text><text x="596" y="662" fill="#9db0c0" font-size="14" font-weight="400" text-anchor="middle">Two-way: master, sync, track info</text>

    <g transform="translate(1090,500)"><circle r="20" fill="#39ff88"/><text y="6" text-anchor="middle" fill="#04150b" font-size="20">③</text></g>
    <path d="M1090 520 V540" stroke="#39ff88" stroke-width="2"/>
    <text x="1220" y="508" fill="#39ff88" text-anchor="end" font-size="14">CDJ 直接浏览播放</text>

    <g transform="translate(900,760)"><circle r="20" fill="#b04dff"/><text y="6" text-anchor="middle" fill="#14001f" font-size="20">④</text></g>
    <text x="40" y="756" fill="#b04dff">CDJ-3000 读取 EngineX 流媒体歌单</text>
    <text x="40" y="778" fill="#9db0c0" font-size="14" font-weight="400">CDJ-3000 browses and plays EngineX streaming playlists directly</text>
    <path d="M880 756 H1000 L1050 735" stroke="#b04dff" stroke-width="2" fill="none"/>
  </g>
</svg>
