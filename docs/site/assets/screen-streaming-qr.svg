<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="-apple-system,'Helvetica Neue','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <title>7 streaming platforms — QR login + OmniSource search / 7 大流媒体扫码登录与聚合搜索</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d131b"/><stop offset="1" stop-color="#06090d"/></linearGradient></defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <text x="40" y="52" fill="#e8f1f8" font-size="26" font-weight="700">7 大流媒体 · 手机扫码登录 · OmniSource 聚合搜索</text>
  <text x="40" y="80" fill="#7f93a5" font-size="15">Scan with your phone to sign in · One search box across all platforms</text>

  <!-- Deck screen: platform list -->
  <rect x="40" y="104" width="560" height="620" rx="16" fill="#05080b" stroke="#2c3b4c" stroke-width="3"/>
  <text x="68" y="144" fill="#e8f1f8" font-size="18" font-weight="700">Settings › Services › Streaming</text>
  <g font-size="17">
    <g fill="#111922" stroke="#243242">
      <rect x="64" y="162" width="512" height="48" rx="8"/><rect x="64" y="218" width="512" height="48" rx="8"/>
      <rect x="64" y="274" width="512" height="48" rx="8"/><rect x="64" y="330" width="512" height="48" rx="8"/>
      <rect x="64" y="386" width="512" height="48" rx="8"/><rect x="64" y="442" width="512" height="48" rx="8"/>
      <rect x="64" y="498" width="512" height="48" rx="8"/>
    </g>
    <circle cx="92" cy="186" r="10" fill="#ffffff"/><text x="116" y="193" fill="#e8f1f8">TIDAL</text>
    <circle cx="92" cy="242" r="10" fill="#e60026"/><text x="116" y="249" fill="#e8f1f8">网易云音乐 NetEase</text>
    <circle cx="92" cy="298" r="10" fill="#1ed760"/><text x="116" y="305" fill="#e8f1f8">Spotify</text>
    <circle cx="92" cy="354" r="10" fill="#a238ff"/><text x="116" y="361" fill="#e8f1f8">Deezer</text>
    <circle cx="92" cy="410" r="10" fill="#ff5500"/><text x="116" y="417" fill="#e8f1f8">SoundCloud</text>
    <circle cx="92" cy="466" r="10" fill="#01ff95"/><text x="116" y="473" fill="#e8f1f8">Beatport</text>
    <circle cx="92" cy="522" r="10" fill="#fa2d48"/><text x="116" y="529" fill="#e8f1f8">Apple Music</text>
    <g fill="#39ff88" font-size="14" text-anchor="end">
      <text x="556" y="192">扫码登录 QR</text><text x="556" y="248">扫码登录 QR</text><text x="556" y="304">扫码登录 QR</text><text x="556" y="360">扫码登录 QR</text>
      <text x="556" y="416">扫码登录 QR</text><text x="556" y="472">扫码登录 QR</text><text x="556" y="528">扫码登录 QR</text>
    </g>
  </g>
  <text x="68" y="640" fill="#7f93a5" font-size="13">Each row opens a QR code · 每一行都会弹出二维码</text>

  <!-- QR dialog -->
  <rect x="640" y="104" width="260" height="300" rx="14" fill="#111922" stroke="#00e5ff" stroke-width="3"/>
  <rect x="680" y="128" width="180" height="180" rx="6" fill="#ffffff"/>
  <g fill="#000">
    <rect x="692" y="140" width="46" height="46"/><rect x="802" y="140" width="46" height="46"/><rect x="692" y="250" width="46" height="46"/>
    <rect x="700" y="148" width="30" height="30" fill="#fff"/><rect x="810" y="148" width="30" height="30" fill="#fff"/><rect x="700" y="258" width="30" height="30" fill="#fff"/>
    <rect x="708" y="156" width="14" height="14"/><rect x="818" y="156" width="14" height="14"/><rect x="708" y="266" width="14" height="14"/>
    <rect x="752" y="150" width="12" height="12"/><rect x="772" y="164" width="12" height="12"/><rect x="752" y="190" width="30" height="12"/><rect x="800" y="204" width="12" height="30"/>
    <rect x="752" y="222" width="12" height="40"/><rect x="778" y="250" width="40" height="12"/><rect x="830" y="250" width="18" height="18"/><rect x="760" y="280" width="30" height="12"/>
  </g>
  <text x="770" y="340" fill="#e8f1f8" font-size="15" text-anchor="middle">手机扫码登录</text>
  <text x="770" y="362" fill="#9db0c0" font-size="13" text-anchor="middle">Scan to sign in · 授权后自动关闭</text>
  <rect x="680" y="372" width="180" height="20" rx="4" fill="#243242"/><text x="770" y="387" fill="#7f93a5" font-size="12" text-anchor="middle">Waiting for phone…</text>

  <!-- Phone -->
  <rect x="940" y="104" width="130" height="260" rx="18" fill="#0e151d" stroke="#2c3b4c" stroke-width="3"/>
  <rect x="954" y="130" width="102" height="208" rx="6" fill="#16202b"/>
  <text x="1005" y="190" fill="#39ff88" font-size="30" text-anchor="middle">✓</text>
  <text x="1005" y="222" fill="#e8f1f8" font-size="12" text-anchor="middle">授权 Authorise</text>
  <path d="M900 240 H936" stroke="#39ff88" stroke-width="3" stroke-dasharray="5 4"/>

  <!-- OmniSource search -->
  <rect x="640" y="430" width="600" height="294" rx="14" fill="#111922" stroke="#243242" stroke-width="2"/>
  <rect x="660" y="450" width="560" height="44" rx="22" fill="#05080b" stroke="#ff9f1c" stroke-width="2"/>
  <text x="688" y="478" fill="#e8f1f8" font-size="17">🔍 Daft Punk — Around the World</text>
  <g font-size="15">
    <rect x="660" y="510" width="560" height="46" rx="8" fill="#16202b"/><circle cx="684" cy="533" r="8" fill="#1ed760"/><text x="706" y="539" fill="#e8f1f8">Around the World — Daft Punk</text><text x="1200" y="539" fill="#9db0c0" text-anchor="end">Spotify · 7:09</text>
    <rect x="660" y="564" width="560" height="46" rx="8" fill="#16202b"/><circle cx="684" cy="587" r="8" fill="#a238ff"/><text x="706" y="593" fill="#e8f1f8">Around the World — Daft Punk</text><text x="1200" y="593" fill="#9db0c0" text-anchor="end">Deezer · FLAC</text>
    <rect x="660" y="618" width="560" height="46" rx="8" fill="#16202b"/><circle cx="684" cy="641" r="8" fill="#01ff95"/><text x="706" y="647" fill="#e8f1f8">Around the World (Radio Edit)</text><text x="1200" y="647" fill="#9db0c0" text-anchor="end">Beatport</text>
    <rect x="660" y="672" width="560" height="38" rx="8" fill="#16202b"/><circle cx="684" cy="691" r="8" fill="#9be8ff"/><text x="706" y="696" fill="#e8f1f8">Around the World</text><text x="1200" y="696" fill="#9db0c0" text-anchor="end">Tidal</text>
  </g>

  <!-- Callouts -->
  <g font-size="16" font-weight="700">
    <g transform="translate(320,760)"><circle r="20" fill="#00e5ff"/><text y="6" text-anchor="middle" fill="#001418" font-size="20">①</text></g>
    <path d="M320 740 V606" stroke="#00e5ff" stroke-width="2"/>
    <text x="350" y="756" fill="#00e5ff">7 大平台列表</text><text x="350" y="776" fill="#9db0c0" font-size="13" font-weight="400">7 platforms, one list</text>

    <g transform="translate(640,452)"><circle r="0"/></g>
    <g transform="translate(920,60)"><circle r="20" fill="#ffffff"/><text y="6" text-anchor="middle" fill="#05080b" font-size="20">②</text></g>
    <path d="M900 72 L840 128" stroke="#ffffff" stroke-width="2"/>
    <text x="952" y="56" fill="#ffffff">二维码弹窗</text><text x="952" y="76" fill="#9db0c0" font-size="13" font-weight="400">QR pop-up on the deck screen</text>

    <g transform="translate(1180,230)"><circle r="20" fill="#39ff88"/><text y="6" text-anchor="middle" fill="#04150b" font-size="20">③</text></g>
    <path d="M1160 236 L1070 250" stroke="#39ff88" stroke-width="2"/>
    <text x="1232" y="186" fill="#39ff88" text-anchor="end">手机授权</text><text x="1232" y="206" fill="#9db0c0" font-size="13" font-weight="400" text-anchor="end">Approve on your phone</text>

    <g transform="translate(1180,400)"><circle r="20" fill="#ff9f1c"/><text y="6" text-anchor="middle" fill="#1b1000" font-size="20">④</text></g>
    <path d="M1160 408 L1100 452" stroke="#ff9f1c" stroke-width="2"/>
    <text x="1140" y="392" fill="#ff9f1c" text-anchor="end">OmniSource 聚合搜索</text><text x="1140" y="412" fill="#9db0c0" font-size="13" font-weight="400" text-anchor="end">One search, all sources</text>
  </g>
