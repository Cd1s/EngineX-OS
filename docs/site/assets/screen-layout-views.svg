<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="-apple-system,'Helvetica Neue','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <title>Layout Manager — 视图管理器</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d131b"/><stop offset="1" stop-color="#06090d"/></linearGradient></defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <text x="40" y="52" fill="#e8f1f8" font-size="26" font-weight="700">Layout Manager · 视图管理器</text>
  <text x="40" y="80" fill="#7f93a5" font-size="15">5 preset views · Save View · Performance Pads off by default · 4 Waveforms</text>

  <rect x="40" y="104" width="820" height="620" rx="16" fill="#111922" stroke="#2c3b4c" stroke-width="2"/>
  <text x="68" y="146" fill="#e8f1f8" font-size="20" font-weight="700">Layout · 布局</text>

  <!-- View buttons -->
  <g font-size="18" font-weight="700" text-anchor="middle">
    <rect x="68" y="168" width="136" height="64" rx="10" fill="#00e5ff" fill-opacity=".16" stroke="#00e5ff" stroke-width="3"/><text x="136" y="208" fill="#00e5ff">View 1</text>
    <rect x="216" y="168" width="136" height="64" rx="10" fill="#1a2430" stroke="#2c3b4c"/><text x="284" y="208" fill="#9db0c0">View 2</text>
    <rect x="364" y="168" width="136" height="64" rx="10" fill="#1a2430" stroke="#2c3b4c"/><text x="432" y="208" fill="#9db0c0">View 3</text>
    <rect x="512" y="168" width="136" height="64" rx="10" fill="#1a2430" stroke="#2c3b4c"/><text x="580" y="208" fill="#9db0c0">View 4</text>
    <rect x="660" y="168" width="136" height="64" rx="10" fill="#1a2430" stroke="#2c3b4c"/><text x="728" y="208" fill="#9db0c0">View 5</text>
  </g>

  <!-- Preview -->
  <rect x="68" y="256" width="728" height="230" rx="10" fill="#05080b" stroke="#243242"/>
  <g>
    <rect x="84" y="270" width="696" height="40" fill="#0c1319"/><rect x="84" y="318" width="696" height="40" fill="#0c1319"/>
    <rect x="84" y="366" width="696" height="40" fill="#0c1319"/><rect x="84" y="414" width="696" height="40" fill="#0c1319"/>
    <path d="M100 290h660M100 338h660M100 386h660M100 434h660" stroke="#00e5ff" stroke-width="10" stroke-dasharray="3 5" opacity=".5"/>
  </g>
  <text x="432" y="474" fill="#7f93a5" font-size="13" text-anchor="middle">Preview of current view · 当前视图预览</text>

  <!-- Toggles -->
  <g font-size="18">
    <text x="68" y="532" fill="#e8f1f8">演奏打击垫 Performance Pads</text>
    <text x="68" y="554" fill="#7f93a5" font-size="13">默认关闭 · off by default (more room for waveforms)</text>
    <rect x="700" y="512" width="96" height="40" rx="20" fill="#243242"/><circle cx="720" cy="532" r="15" fill="#9db0c0"/>
    <text x="680" y="538" fill="#7f93a5" font-size="14" text-anchor="end">OFF</text>

    <text x="68" y="602" fill="#e8f1f8">四轨波形显示 4-Deck Waveform</text>
    <text x="68" y="624" fill="#7f93a5" font-size="13">四轨同屏 · all four decks on one screen</text>
    <rect x="700" y="582" width="96" height="40" rx="20" fill="#39ff88"/><circle cx="776" cy="602" r="15" fill="#04150b"/>
    <text x="680" y="608" fill="#39ff88" font-size="14" text-anchor="end">ON</text>
  </g>

  <!-- Save button -->
  <rect x="68" y="654" width="728" height="52" rx="10" fill="#ff9f1c"/>
  <text x="432" y="688" fill="#1b1000" font-size="20" font-weight="700" text-anchor="middle">保存视图 Save View</text>

  <!-- Callouts -->
  <g font-size="16" font-weight="700">
    <g transform="translate(900,200)"><circle r="20" fill="#00e5ff"/><text y="6" text-anchor="middle" fill="#001418" font-size="20">①</text></g>
    <path d="M880 200 H800" stroke="#00e5ff" stroke-width="2"/>
    <text x="934" y="196" fill="#00e5ff">View 1 ~ View 5</text>
    <text x="934" y="218" fill="#9db0c0" font-size="14" font-weight="400">五个预设，一键切换 · 5 presets, tap to switch</text>

    <g transform="translate(900,360)"><circle r="20" fill="#ffffff"/><text y="6" text-anchor="middle" fill="#05080b" font-size="20">②</text></g>
    <path d="M880 360 H800" stroke="#ffffff" stroke-width="2"/>
    <text x="934" y="356" fill="#ffffff">当前视图预览</text>
    <text x="934" y="378" fill="#9db0c0" font-size="14" font-weight="400">Live preview of the layout</text>

    <g transform="translate(900,532)"><circle r="20" fill="#b04dff"/><text y="6" text-anchor="middle" fill="#14001f" font-size="20">③</text></g>
    <path d="M880 532 H800" stroke="#b04dff" stroke-width="2"/>
    <text x="934" y="528" fill="#b04dff">Pads 默认关闭</text>
    <text x="934" y="550" fill="#9db0c0" font-size="14" font-weight="400">Performance Pads off by default</text>

    <g transform="translate(900,602)"><circle r="20" fill="#39ff88"/><text y="6" text-anchor="middle" fill="#04150b" font-size="20">④</text></g>
    <path d="M880 602 H800" stroke="#39ff88" stroke-width="2"/>
    <text x="934" y="598" fill="#39ff88">4 Waveforms 开关</text>
    <text x="934" y="620" fill="#9db0c0" font-size="14" font-weight="400">Toggle four-deck waveforms</text>

    <g transform="translate(900,680)"><circle r="20" fill="#ff9f1c"/><text y="6" text-anchor="middle" fill="#1b1000" font-size="20">⑤</text></g>
    <path d="M880 680 H800" stroke="#ff9f1c" stroke-width="2"/>
    <text x="934" y="676" fill="#ff9f1c">保存视图 Save View</text>
    <text x="934" y="698" fill="#9db0c0" font-size="14" font-weight="400">Store current setup into the view</text>
  </g>
</svg>
