    <ul>
      <li>Gen 1 (direct USB *-Update.img): Denon DJ SC5000 Prime, SC5000M Prime, SC6000 Prime, SC6000M Prime, PRIME 4, PRIME 2, PRIME GO, Numark Mixstream Pro</li>
