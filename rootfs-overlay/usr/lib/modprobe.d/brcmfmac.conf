# Loaded by udev before the /etc overlay exists, so this lives in the rootfs.
# Disable PNO (sched scan), firmware supplicant and SAE: broken on BCM4339 6.37.39.113
# (SC5000). Only that chip (SDIO 02d0:4335 or 02d0:4339) gets it: the same images ship
# BCM43455 and BCM43456 firmware, and those chips load with the stock driver settings.
install brcmfmac for d in /sys/bus/sdio/devices/*; do [ -r "$d/device" ] && read -r v < "$d/vendor" && read -r p < "$d/device" && case $v:$p in 0x02d0:0x4335|0x02d0:0x4339) exec /sbin/modprobe --ignore-install brcmfmac feature_disable=0x82004 $CMDLINE_OPTS;; esac; done; exec /sbin/modprobe --ignore-install brcmfmac $CMDLINE_OPTS
