# Loaded by udev before the /etc overlay exists, so this lives in the rootfs.
# Disable PNO (sched scan), firmware supplicant and SAE: broken on BCM4339 6.37.39.113
# (SC5000). Only a chip the SDIO IDs show is another Broadcom/Cypress one (the same images
# ship BCM43455 and BCM43456 firmware) loads with the stock driver settings. When no ID can
# be read, e.g. a load before the SDIO card is enumerated, the workaround stays on as before.
install brcmfmac f=feature_disable=0x82004; for d in /sys/bus/sdio/devices/*; do read -r v < "$d/vendor" && read -r p < "$d/device" || continue; case $v:$p in 0x02d0:0x4335|0x02d0:0x4339) f=feature_disable=0x82004; break;; 0x02d0:0x[0-9a-f][0-9a-f][0-9a-f][0-9a-f]|0x04b4:0x[0-9a-f][0-9a-f][0-9a-f][0-9a-f]) f=;; esac; done 2>/dev/null; exec /sbin/modprobe --ignore-install brcmfmac $f $CMDLINE_OPTS
