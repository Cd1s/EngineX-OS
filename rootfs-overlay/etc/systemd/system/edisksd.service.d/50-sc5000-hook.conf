[Unit]
# The hook runs /usr/local/bin/rb-bridge (sc5000-suite-exec: mkdir -p /data/sc5000-custom/bin)
# for a stick mounted at boot: not while sc5000-custom-prepare moves that dir (#103).
# Ordering only: edisksd is a vendor unit and prepare is pulled in by sc5000-custom.target.
After=sc5000-custom-prepare.service

[Service]
Environment=LD_PRELOAD=/etc/sc5000/libedisksd-hook.so
