[Unit]
# The hook runs /usr/local/bin/rb-bridge (enginex-suite-exec: mkdir -p /data/enginex/bin)
# for a stick mounted at boot: not while enginex-prepare moves that dir (#103).
# Ordering only: edisksd is a vendor unit and prepare is pulled in by enginex.target.
After=enginex-prepare.service

[Service]
Environment=LD_PRELOAD=/etc/enginex/libedisksd-hook.so
