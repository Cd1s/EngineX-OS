[Unit]
Wants=engine-guardian.service

[Service]
Environment=QT_LOGGING_CONF=/data/logging.ini
EnvironmentFile=-/etc/default/enginex-perf
# The per-Engine launcher chooses the hook before exec, including retries made
# inside the vendor shell. Fallback has no preload in Engine's environment.
UnsetEnvironment=LD_PRELOAD
ExecStart=
ExecStart=/etc/enginex/engine-ui-guard service /usr/Engine/Scripts/runengine
ExecStartPre=-/etc/enginex/engine-ui-guard pre
ExecStartPost=-/etc/enginex/engine-ui-guard post
