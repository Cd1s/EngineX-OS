title = "EngineX OS verified false positives"

[extend]
useDefault = true

[[allowlists]]
description = "Fake tunnel token: decoded TEST fixture"
condition = "AND"
paths = ['^pkg/webui/tunnel_test\.go$']
regexTarget = "secret"
regexes = [
  '''^eyJhIjoiVEVTVF9UT0tFTiJ9$''',
]

[[allowlists]]
description = "Fake ES256 JWT with TEAM issuer"
condition = "AND"
paths = ['^pkg/webui/applemusic_test\.go$']
regexTarget = "secret"
regexes = [
  '''^eyJhbGciOiJFUzI1NiJ9\.eyJpc3MiOiJURUFNIiwiZXhwIjo0MTAyNDQ0ODAwfQ\.c2lnbmF0dXJlLWJ5dGVzLWxvbmctZW5vdWdo$''',
]

[[allowlists]]
description = "Public Deezer Blowfish protocol constant"
condition = "AND"
paths = ['^internal/deezer/deezer\.go$']
regexTarget = "secret"
regexes = [
  '''^g4el58wc0zvf9na1$''',
]

[[allowlists]]
description = "Public NetEase weapi protocol constants"
condition = "AND"
paths = ['^pkg/providers/netease_web\.go$']
regexTarget = "secret"
regexes = [
  '''^0CoJUm6Qyw8W8jud$''',
  '''^00e0b509f6259df8642dbc35662901477df22677ec152b5ff68ace615bb7b725152b3ab17a876aea8a5aa76d2e417629ec4ee341f56135fccf695280104e0312ecbda92557c93870114af6c9d05c4f7f0c3685b7a46bee255932575cce10b424d813cfe4875d3e82047b97ddef52741d546b8e289dc6935b3ece0462db0a22b8e7$''',
]

[[allowlists]]
description = "Public alphabet used to generate random console access codes"
condition = "AND"
paths = ['^pkg/webui/server\.go$']
regexTarget = "secret"
regexes = [
  '''^23456789ABCDEFGHJKLMNPQRSTUVWXYZ$''',
]
