# /etc/systemd/system/sc5000-deemix-relay.service.d/50-stems.conf
# Hands sc5000-stemsd's internal token to the DynamicUser relay as
# $CREDENTIALS_DIRECTORY/stems-token, which -stems-token-file uses by default.
# Install only where /etc/sc5000-stems/token exists: a missing source file
# stops the relay from starting.
[Service]
LoadCredential=stems-token:/etc/sc5000-stems/token
