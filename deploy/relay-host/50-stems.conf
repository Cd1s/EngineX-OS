# /etc/systemd/system/enginex-deemix-relay.service.d/50-stems.conf
# Hands enginex-stemsd's internal token to the DynamicUser relay as
# $CREDENTIALS_DIRECTORY/stems-token, which -stems-token-file uses by default.
# Install only where /etc/enginex-stems/token exists: a missing source file
# stops the relay from starting.
[Service]
LoadCredential=stems-token:/etc/enginex-stems/token
